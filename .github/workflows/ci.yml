name: CI

# The pipeline needs network access and a long compute budget, so CI does not run it.
# What CI protects is the correctness layer: the no-lookahead guarantee, the embargo, the
# split boundaries and the metric definitions. Those are exactly the things whose bugs are
# silent — they do not crash, they just quietly inflate every number in the README.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost pyarrow pytest

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

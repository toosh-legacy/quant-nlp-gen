name: CI

# The pipeline needs network access and a long compute budget, so CI does not run it.
# What CI protects is the correctness layer: the no-lookahead guarantee, the embargo, the
# split boundaries and the metric definitions. Those are exactly the things whose bugs are
# silent — they do not crash, they just quietly inflate every number in the README.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # fastapi/httpx are needed by tests/test_api.py. They were missing, so that file's
      # seven tests were being skipped in CI while passing locally — the worst kind of gap,
      # because the suite still reported green.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn xgboost pyarrow pytest fastapi httpx

      # Every test file must actually run. `--strict-markers` and an explicit collection
      # count stop a missing dependency from silently shrinking the suite again.
      - name: Run tests
        run: pytest -q --strict-markers -p no:randomly

      - name: Assert the API tests were collected
        run: pytest -q --collect-only tests/test_api.py | tail -1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
